name: Python Formatting

on: [push, pull_request]

jobs:
  formatting:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'  # Specify the Python version you need

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort autoflake flake8

    - name: Run Autoflake to remove unused imports
      run: autoflake --remove-all-unused-imports --recursive --remove-unused-variables --in-place .

    - name: Run Isort to sort imports
      run: isort .

    - name: Run Black to format code
      run: black .

    - name: Run Flake8 to check for style guide enforcement
      run: flake8 .

    - name: Commit changes if any
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git diff --quiet || git commit -m "Format code with black, isort, and autoflake"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
